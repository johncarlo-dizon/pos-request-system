<style>
  :root {
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    padding: 24px 16px 60px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .topbar h1 { font-size: 20px; margin: 0; }
  .topbar a {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .topbar a:hover { text-decoration: underline; }

  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .toolbar input[type="text"],
  .toolbar select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: inherit;
    background: #fff;
  }
  .toolbar input[type="text"] { flex: 1; min-width: 220px; }
  .toolbar input:focus, .toolbar select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }

  .table-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

  thead th {
    text-align: left;
    background: #f8fafc;
    color: var(--muted);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }

  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f8fafc; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .badge.Submitted { background: #fef9c3; color: #854d0e; }
  .badge.Generated { background: #dcfce7; color: #166534; }
  .badge.default   { background: #e2e8f0; color: var(--muted); }

  .doclinks a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 12.5px;
    margin-right: 10px;
  }
  .doclinks a:hover { text-decoration: underline; }

  .empty, .loading {
    padding: 40px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }

  .count {
    font-size: 12.5px;
    color: var(--muted);
    margin: 10px 2px 0;
  }

  @media (max-width: 700px) {
    .table-card { overflow-x: auto; }
    table { min-width: 680px; }
  }
</style>
