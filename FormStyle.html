<style>
  :root {
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --danger: #dc2626;
    --ok: #16a34a;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    padding: 24px 16px 60px;
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .topbar h1 { font-size: 20px; margin: 0; }
  .topbar a {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .topbar a:hover { text-decoration: underline; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }

  .card h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent-dark);
    margin: 0 0 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .card p.hint {
    font-size: 12.5px;
    color: var(--muted);
    margin: -8px 0 16px;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .grid.two-col-metrics { grid-template-columns: 1fr 1fr; }

  .field { display: flex; flex-direction: column; margin-bottom: 14px; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }
  label .req { color: var(--danger); margin-left: 2px; }
  label .opt { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: 4px; }

  input[type="text"],
  input[type="date"],
  input[type="number"],
  textarea {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: border-color .15s;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }

  textarea { resize: vertical; min-height: 64px; }

  .checkline {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--border);
  }
  .checkline:last-child { border-bottom: none; }
  .checkline input { width: 18px; height: 18px; accent-color: var(--accent); }
  .checkline span { font-size: 14px; }

  .metric-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--border);
  }
  .metric-row:last-of-type { border-bottom: none; }
  .metric-row .field { margin-bottom: 0; }
  .metric-row .colhead {
    grid-column: 1 / -1;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .03em;
    margin-top: 4px;
  }

  .approval-block {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .approval-block h3 {
    font-size: 13.5px;
    margin: 0 0 10px;
    color: var(--text);
  }
  .approval-block .row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 0.9fr;
    gap: 12px;
    align-items: end;
  }
  .decision-choice {
    display: flex;
    gap: 14px;
    padding-top: 4px;
  }
  .decision-choice label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    font-size: 13px;
  }
  .decision-choice input { accent-color: var(--accent); }

  .am-note {
    font-size: 12.5px;
    color: var(--muted);
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }

  .financial-note {
    font-size: 13px;
    color: var(--muted);
    background: #f8fafc;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .submit-bar {
    position: sticky;
    bottom: 0;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 14px 0 4px;
  }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled { background: #93c5fd; cursor: not-allowed; }

  .msg {
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13.5px;
    margin-bottom: 16px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
  .msg.error { background: #fef2f2; border: 1px solid #fecaca; color: var(--danger); }
  .msg a { color: inherit; font-weight: 700; }

  /* Decision / Date fields for a role stay dimmed until that role's Name is filled */
  input:disabled,
  .decision-choice input:disabled + label,
  input[data-role-field]:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .decision-choice label:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }

  /* Success modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }

  .modal-box {
    background: #fff;
    border-radius: 14px;
    max-width: 380px;
    width: 100%;
    padding: 28px 26px 24px;
    text-align: center;
    box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
  }

  .modal-icon {
    width: 52px;
    height: 52px;
    line-height: 52px;
    border-radius: 50%;
    background: #dcfce7;
    color: #16a34a;
    font-size: 26px;
    font-weight: 700;
    margin: 0 auto 14px;
  }

  .modal-box h3 { margin: 0 0 8px; font-size: 17px; }
  .modal-box p { margin: 0 0 18px; font-size: 13.5px; color: var(--muted); }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .modal-link {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 8px;
  }
  .modal-link:hover { background: #f8fafc; }

  .modal-box button.primary { width: 100%; }

  @media (max-width: 600px) {
    .grid, .metric-row, .approval-block .row { grid-template-columns: 1fr; }
  }
</style>
